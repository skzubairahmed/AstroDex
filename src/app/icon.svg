<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Deep Space Background -->
  <rect width="32" height="32" rx="7" fill="#0B0F19"/>
  
  <!-- Orbital Ring Path -->
  <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#06B6D4" stroke-width="1.5" transform="rotate(-30 16 16)" opacity="0.8"/>
  
  <!-- Central Exoplanet / Star -->
  <circle cx="16" cy="16" r="3.5" fill="#FBBF24"/>
  
  <!-- Orbiting Satellite / Asteroid dot -->
  <circle cx="7" cy="11" r="1.5" fill="#F43F5E"/>
</svg>
